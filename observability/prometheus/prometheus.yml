global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: demo-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8080

  - job_name: demo-dependency
    metrics_path: /metrics
    static_configs:
      - targets:
          - dependency:8080

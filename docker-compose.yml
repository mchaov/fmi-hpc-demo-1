services:
  api:
    build:
      context: ./services/api
    container_name: university-hpc-api
    environment:
      PORT: "8080"
      SERVICE_NAME: "demo-api"
      SERVICE_VERSION: "v2"
      DEPLOYMENT_ENVIRONMENT: "demo"
      LOG_LEVEL: "info"
      ENABLE_TRACING: "true"
      TEMPO_ENDPOINT: "http://tempo:4318/v1/traces"
      DEPENDENCY_URL: "http://dependency:8080"
      OTEL_SERVICE_NAME: "demo-api"
      OTEL_RESOURCE_ATTRIBUTES: "service.version=v2,deployment.environment=demo"
    ports:
      - "8080:8080"
    depends_on:
      - dependency
      - tempo
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  dependency:
    build:
      context: ./services/dependency
    container_name: university-hpc-dependency
    environment:
      PORT: "8080"
      SERVICE_NAME: "demo-dependency"
      SERVICE_VERSION: "v2"
      DEPLOYMENT_ENVIRONMENT: "demo"
      LOG_LEVEL: "info"
      ENABLE_TRACING: "true"
      TEMPO_ENDPOINT: "http://tempo:4318/v1/traces"
      OTEL_SERVICE_NAME: "demo-dependency"
      OTEL_RESOURCE_ATTRIBUTES: "service.version=v2,deployment.environment=demo"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    build:
      context: ./observability/prometheus
    container_name: university-hpc-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    depends_on:
      - api
      - dependency
      - docker-metrics
      - cadvisor
      - node-exporter

  grafana:
    build:
      context: ./observability/grafana
    container_name: university-hpc-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    build:
      context: ./observability/loki
    container_name: university-hpc-loki
    command:
      - "-config.file=/etc/loki/config.yml"
    volumes:
      - loki-data:/loki

  promtail:
    build:
      context: ./observability/promtail
    container_name: university-hpc-promtail
    command:
      - "-config.file=/etc/promtail/config.yml"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki

  tempo:
    build:
      context: ./observability/tempo
    container_name: university-hpc-tempo
    command:
      - "-config.file=/etc/tempo/tempo.yml"
    volumes:
      - tempo-data:/var/tempo

  docker-metrics:
    build:
      context: ./services/docker-metrics
    container_name: university-hpc-docker-metrics
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9105/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: university-hpc-cadvisor
    privileged: true
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=5s"
      - "--max_housekeeping_interval=10s"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  node-exporter:
    image: prom/node-exporter:latest
    container_name: university-hpc-node-exporter
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(dev|host|proc|run/credentials/.+|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)"
      - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tmpfs|tracefs)$"
    volumes:
      - /:/host:ro

  k6:
    build:
      context: ./k6
    container_name: university-hpc-k6
    profiles:
      - loadtest
    environment:
      BASE_URL: "http://api:8080"
      K6_OUT: "experimental-prometheus-rw"
      K6_PROMETHEUS_RW_SERVER_URL: "http://prometheus:9090/api/v1/write"
      K6_PROMETHEUS_RW_PUSH_INTERVAL: "5s"
      K6_PROMETHEUS_RW_TREND_STATS: "p(95),p(99),avg,min,max"
    depends_on:
      - api
      - prometheus
    entrypoint: ["/bin/sh", "/scripts/run.sh"]
    command: ["run", "/scripts/smoke.js"]

volumes:
  grafana-data:
  loki-data:
  prometheus-data:
  tempo-data:
